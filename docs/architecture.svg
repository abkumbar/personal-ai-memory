<g class="gray"><rect x="350" y="620" width="290" height="56" rx="8" stroke-width="0.5"/><text class="th" x="495" y="640" text-anchor="middle" dominant-baseline="central">Tailscale Funnel</text><text class="ts" x="495" y="658" text-anchor="middle" dominant-baseline="central">secure public URL</text></g>
