<g class="gray"><rect x="195" y="40" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="60" text-anchor="middle" dominant-baseline="central">Claude export</text><text class="ts" x="262" y="78" text-anchor="middle" dominant-baseline="central">data download</text></g>
<g class="gray"><rect x="350" y="40" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="60" text-anchor="middle" dominant-baseline="central">Grok export</text><text class="ts" x="417" y="78" text-anchor="middle" dominant-baseline="central">data download</text></g>
