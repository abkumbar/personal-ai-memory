<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830">
<style>
text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}.t{font-size:14px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.box rect{fill:#FFFFFF;stroke:#B4B2A9}.box .th{fill:#2C2C2A}.box .ts{fill:#5F5E5A}
.plain{fill:#2C2C2A}.legend{fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="830" fill="#FFFFFF"/>
